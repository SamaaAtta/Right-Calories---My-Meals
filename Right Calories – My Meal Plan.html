<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Right Calories – My Meal Plan</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#ded9d3;--ink:#12372f;--card:#e8e5de;--mut:#5c6f69;--line:#b9b5aa;--acc:#12372f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 48px}
header{text-align:center;padding:12px 0 8px}
header img{width:180px;max-width:60%}
h1{font-size:1.5rem;margin:8px 0 2px;font-weight:800}
.sub{color:var(--mut);margin:0}
.prog{margin:20px auto;max-width:520px}
.bar{height:12px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--ink);transition:width .3s}
.pt{display:flex;justify-content:space-between;font-size:.85rem;margin-top:6px;font-weight:600}
.week h2{font-size:1rem;margin:28px 0 10px;font-weight:800;letter-spacing:.04em;text-transform:uppercase}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:10px}
.hd{font-size:.75rem;color:var(--mut);font-weight:800;text-align:center;text-transform:uppercase}
.card{background:var(--card);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:6px;border:2px solid transparent}
.card.done{border-color:var(--ink)}
.card.off{opacity:.55}
.card.none{visibility:hidden}
.top{display:flex;justify-content:space-between;align-items:baseline}
.dn{font-weight:800;font-size:1.3rem}.dm{font-size:.75rem;color:var(--mut);font-weight:600}
label{font-size:.7rem;font-weight:800;color:var(--mut);text-transform:uppercase}
input[type=text]{width:100%;border:1.5px solid var(--line);background:#f3f1ec;border-radius:10px;padding:8px;font:inherit;font-size:.9rem;color:var(--ink)}
input:focus{outline:2px solid var(--ink)}
.offb{margin-top:auto;background:none;border:0;color:var(--mut);font:inherit;font-size:.72rem;text-decoration:underline;cursor:pointer;text-align:left;padding:0}
footer{text-align:center;margin-top:36px}
footer button{background:var(--ink);color:#fff;border:0;border-radius:99px;padding:10px 20px;font:inherit;font-weight:700;cursor:pointer}
@media(max-width:820px){.grid{grid-template-columns:1fr 1fr}.hd{display:none}}
@media(max-width:480px){.grid{grid-template-columns:1fr}}
.scroll{overflow-x:auto}
table{border-collapse:separate;border-spacing:6px;width:100%}
th,td{background:var(--card);border-radius:12px;padding:8px;vertical-align:middle}
th.rl{position:sticky;left:0;z-index:1;width:70px;min-width:70px;font-weight:800;text-transform:uppercase;font-size:.8rem;background:var(--bg);text-align:left}
th.dh{min-width:120px;text-align:center;font-weight:600}
th.dh b{display:block;font-size:1.3rem;font-weight:800}
th.dh small{display:block;color:var(--mut);font-size:.72rem}
th.dh.done{background:var(--ink);color:#fff}th.dh.done small{color:#cfd8d4}
td.offc{text-align:center;color:var(--mut);font-size:.8rem;opacity:.7}
.one{width:100%;border-collapse:separate;border-spacing:0 6px;margin-top:20px}
.one th{background:none;padding:6px 8px;text-align:left;font-size:.75rem;text-transform:uppercase;color:var(--mut);font-weight:800}
.one td{background:var(--card);padding:8px;border-radius:0}
.one td:first-child{border-radius:12px 0 0 12px;white-space:nowrap}.one td:last-child{border-radius:0 12px 12px 0}
.one tr.done td:first-child{background:var(--ink);color:#fff}.one tr.done td:first-child small{color:#cfd8d4}
.one tr.off td{opacity:.55}
.one td b{font-size:1.2rem;font-weight:800;margin-right:6px}.one td small{color:var(--mut);font-weight:600}
.one .offb{white-space:nowrap}
@media(max-width:560px){.one input{min-width:110px}.one{display:block;overflow-x:auto}}
.act{border:0;border-radius:99px;padding:7px 16px;font:inherit;font-weight:700;cursor:pointer;min-width:64px}
.act.sv{background:var(--ink);color:#fff}.act.ed{background:none;color:var(--ink);border:1.5px solid var(--ink)}
.one input:disabled{background:transparent;border-color:transparent;font-weight:600;opacity:1;-webkit-text-fill-color:var(--ink)}
</style></head><body><div class="wrap">

<div class="prog"><div class="bar"><i id="fill"></i></div><div class="pt"><span id="cnt">0 / 20 days planned</span><span id="pct">0%</span></div></div>
<div id="weeks"></div>
<footer><button id="reset">Clear all</button></footer>
</div>
<script>
const K='rc-plan-v1',D=['Sat','Sun','Mon','Tue','Wed','Thu','Fri'],M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
let S={};try{S=JSON.parse(localStorage.getItem(K)||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const start=new Date(2026,9,5),end=new Date(2026,10,1);
const key=d=>d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
const get=(d,i)=>S[key(d)]||(S[key(d)]={l:'',s:'',off:i==0||i==6});
const root=document.getElementById('weeks');
function build(){
 let r='<table class="one"><tr><th>Date</th><th>Lunch</th><th>Snack</th><th></th><th></th></tr>';
 for(let d=new Date(start),i=2;d<=end;d.setDate(d.getDate()+1),i=(i+1)%7){
  const st=get(d,i),k=key(d);
  r+='<tr data-k="'+k+'" class="'+(st.off?'off':'')+'"><td><b>'+d.getDate()+'</b><small>'+D[i]+' · '+M[d.getMonth()]+'</small></td>'+
  (st.off?'<td colspan="2"><small>Day off</small></td>':'<td><input type="text" '+(st.saved?'disabled ':'')+'data-k="'+k+'" data-f="l" placeholder="Chosen meal"></td><td><input type="text" '+(st.saved?'disabled ':'')+'data-k="'+k+'" data-f="s" placeholder="Chosen snack"></td>')+
  '<td>'+(st.off?'':'<button class="act '+(st.saved?'ed':'sv')+'" data-k="'+k+'">'+(st.saved?'Edit':'Save')+'</button>')+'</td>'+
  '<td><button class="offb" data-k="'+k+'">'+(st.off?'Add to plan':'Day off')+'</button></td></tr>';
 }
 root.innerHTML=r+'</table>';
 root.querySelectorAll('input').forEach(inp=>{const st=S[inp.dataset.k];inp.value=st[inp.dataset.f];inp.oninput=()=>{st[inp.dataset.f]=inp.value;save();upd(inp.dataset.k)}});
 root.querySelectorAll('.offb').forEach(b=>b.onclick=()=>{const st=S[b.dataset.k];st.off=!st.off;save();build()});
 root.querySelectorAll('.act').forEach(b=>b.onclick=()=>{const st=S[b.dataset.k];st.saved=!st.saved;save();build()});
 Object.keys(S).forEach(k=>upd(k,1));
 prog();
}
function upd(k,np){const st=S[k],tr=document.querySelector('tr[data-k="'+k+'"]');if(tr)tr.classList.toggle('done',!st.off&&!!st.saved&&!!st.l.trim());if(!np)prog()}
function prog(){
 let t=0,f=0;
 for(let d=new Date(start);d<=end;d.setDate(d.getDate()+1)){const s=S[key(d)];if(s&&!s.off){t++;if(s.saved&&s.l.trim())f++}}
 const p=t?Math.round(f/t*100):0;
 document.getElementById('fill').style.width=p+'%';
 document.getElementById('cnt').textContent=f+' / '+t+' days planned';
 document.getElementById('pct').textContent=p+'%';
}
document.getElementById('reset').onclick=()=>{if(confirm('Clear all meals?')){S={};save();build()}};
build();
</script></body></html>
