
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Right Calories – My Meal Plan</title>

<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --bg:#ded9d3;
  --ink:#12372f;
  --card:#e8e5de;
  --mut:#5c6f69;
  --line:#b9b5aa;
  --acc:#12372f;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px)
}

html{
  scroll-padding-top:env(safe-area-inset-top,0px)
}

*{
  box-sizing:border-box
}

body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:Nunito,system-ui,sans-serif
}

.wrap{
  max-width:1100px;
  margin:0 auto;
  padding:20px 16px 48px
}

/* LOGIN */

#loginScreen{
  min-height:100vh;
  min-height:100dvh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  box-sizing:border-box;
}

#logoutBtn {
  position:absolute;
  top:15px;
  left:15px;
}

.login-card{
  width:100%;
  max-width:380px;
  box-sizing:border-box;
  text-align:center;
}

.login-card img{
  width:220px;
  max-width:80%;
  height:auto;
  display:block;
  margin:0 auto 15px;
}

.login-card h1{
  margin:8px 0 4px;
  font-size:1.5rem;
}

.login-card p{
  color:var(--mut);
  margin:0 0 20px;
}

.login-card input{
  width:100%;
  box-sizing:border-box;
  margin:7px 0;
  border:1.5px solid var(--line);
  background:#f3f1ec;
  border-radius:10px;
  padding:12px 14px;
  font:inherit;
  font-size:16px;
  color:var(--ink);
}

.login-card input:focus{
  outline:2px solid var(--ink);
}

.login-card button{
  width:100%;
  box-sizing:border-box;
  margin-top:10px;
  background:var(--ink);
  color:#fff;
  border:0;
  border-radius:99px;
  padding:11px 20px;
  font:inherit;
  font-weight:700;
  cursor:pointer;
}

.login-error{
  color:#9b2c2c;
  font-size:.85rem;
  margin-top:12px;
  min-height:20px;
}

/* iPhone / small screens */

@media (max-width:600px){
  #loginScreen{
    padding:20px;
  }

  .login-card{
    width:100%;
    max-width:360px;
  }

  .login-card img{
    width:200px;
    max-width:75%;
  }

  .login-card h1{
    font-size:1.4rem;
  }

  .login-card input,
  .login-card button{
    width:100%;
  }
}

/* MAIN */

#app{
  display:none
}

header{
  text-align:center;
  padding:12px 0 8px
}

header img {
  width: 220px;
  height: auto;
  display: block;
  margin: 0 auto 10px;
}

h1{
  font-size:1.5rem;
  margin:8px 0 2px;
  font-weight:800
}

.sub{
  color:var(--mut);
  margin:0
}

.account{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:10px;
  margin-top:12px;
  font-size:.8rem;
  color:var(--mut)
}

.logout{
  border:1px solid var(--ink);
  background:none;
  color:var(--ink);
  border-radius:99px;
  padding:5px 12px;
  font:inherit;
  cursor:pointer
}

.prog{
  margin:20px auto;
  max-width:520px
}

.bar{
  height:12px;
  background:var(--line);
  border-radius:99px;
  overflow:hidden
}

.bar i{
  display:block;
  height:100%;
  width:0;
  background:var(--ink);
  transition:width .3s
}

.pt{
  display:flex;
  justify-content:space-between;
  font-size:.85rem;
  margin-top:6px;
  font-weight:600
}

.week h2{
  font-size:1rem;
  margin:28px 0 10px;
  font-weight:800;
  letter-spacing:.04em;
  text-transform:uppercase
}

.grid{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:10px
}

.hd{
  font-size:.75rem;
  color:var(--mut);
  font-weight:800;
  text-align:center;
  text-transform:uppercase
}

.card{
  background:var(--card);
  border-radius:16px;
  padding:12px;
  display:flex;
  flex-direction:column;
  gap:6px;
  border:2px solid transparent
}

.card.done{
  border-color:var(--ink)
}

.card.off{
  opacity:.55
}

.card.none{
  visibility:hidden
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:baseline
}

.dn{
  font-weight:800;
  font-size:1.3rem
}

.dm{
  font-size:.75rem;
  color:var(--mut);
  font-weight:600
}

label{
  font-size:.7rem;
  font-weight:800;
  color:var(--mut);
  text-transform:uppercase
}

input[type=text]{
  width:100%;
  border:1.5px solid var(--line);
  background:#f3f1ec;
  border-radius:10px;
  padding:8px;
  font:inherit;
  font-size:.9rem;
  color:var(--ink)
}

input:focus{
  outline:2px solid var(--ink)
}

.offb{
  margin-top:auto;
  background:none;
  border:0;
  color:var(--mut);
  font:inherit;
  font-size:.72rem;
  text-decoration:underline;
  cursor:pointer;
  text-align:left;
  padding:0
}

footer{
  text-align:center;
  margin-top:36px
}

footer button{
  background:var(--ink);
  color:#fff;
  border:0;
  border-radius:99px;
  padding:10px 20px;
  font:inherit;
  font-weight:700;
  cursor:pointer
}

@media(max-width:820px){
  .grid{
    grid-template-columns:1fr 1fr
  }

  .hd{
    display:none
  }
}

@media(max-width:480px){
  .grid{
    grid-template-columns:1fr
  }
}

.scroll{
  overflow-x:auto
}

table{
  border-collapse:separate;
  border-spacing:6px;
  width:100%
}

th,td{
  background:var(--card);
  border-radius:12px;
  padding:8px;
  vertical-align:middle
}

th.rl{
  position:sticky;
  left:0;
  z-index:1;
  width:70px;
  min-width:70px;
  font-weight:800;
  text-transform:uppercase;
  font-size:.8rem;
  background:var(--bg);
  text-align:left
}

th.dh{
  min-width:120px;
  text-align:center;
  font-weight:600
}

th.dh b{
  display:block;
  font-size:1.3rem;
  font-weight:800
}

th.dh small{
  display:block;
  color:var(--mut);
  font-size:.72rem
}

th.dh.done{
  background:var(--ink);
  color:#fff
}

th.dh.done small{
  color:#cfd8d4
}

td.offc{
  text-align:center;
  color:var(--mut);
  font-size:.8rem;
  opacity:.7
}

.one{
  width:100%;
  border-collapse:separate;
  border-spacing:0 6px;
  margin-top:20px
}

.one th{
  background:none;
  padding:6px 8px;
  text-align:left;
  font-size:.75rem;
  text-transform:uppercase;
  color:var(--mut);
  font-weight:800
}

.one td{
  background:var(--card);
  padding:8px;
  border-radius:0
}

.one td:first-child{
  border-radius:12px 0 0 12px;
  white-space:nowrap
}

.one td:last-child{
  border-radius:0 12px 12px 0
}

.one tr.done td:first-child{
  background:var(--ink);
  color:#fff
}

.one tr.done td:first-child small{
  color:#cfd8d4
}

.one tr.off td{
  opacity:.55
}

.one td b{
  font-size:1.2rem;
  font-weight:800;
  margin-right:6px
}

.one td small{
  color:var(--mut);
  font-weight:600
}

.one .offb{
  white-space:nowrap
}


.act{
  border:0;
  border-radius:99px;
  padding:7px 16px;
  font:inherit;
  font-weight:700;
  cursor:pointer;
  min-width:64px
}

.act.sv{
  background:var(--ink);
  color:#fff
}

.act.ed{
  background:none;
  color:var(--ink);
  border:1.5px solid var(--ink)
}

.one input:disabled{
  background:transparent;
  border-color:transparent;
  font-weight:600;
  opacity:1;
  -webkit-text-fill-color:var(--ink)
}

.status{
  text-align:center;
  min-height:20px;
  margin-top:8px;
  color:var(--mut);
  font-size:.8rem
}

/* MOBILE TABLE */

@media (max-width:600px){

  #weeks{
    width:100%;
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
  }

  #weeks .one{
    width:600px;
    min-width:600px;
    table-layout:fixed;
    border-spacing:2 2px;
  }

  #weeks .one th,
  #weeks .one td{
    white-space:normal;
  }

  /* DATE */
  #weeks .one th:nth-child(1),
  #weeks .one td:nth-child(1){
    width:20px;
    min-width:20px;
    max-width:20px;
    padding-right:1px;

  }

  /* LUNCH */
  #weeks .one th:nth-child(2),
  #weeks .one td:nth-child(2){
    width:50px;
    min-width:50px;
    max-width:50px;
    padding-right:2px;
    white-space:normal;
    overflow-wrap:anywhere;
    word-break:break-word;
    line-height:1.3;
  }

  /* SNACK */
  #weeks .one th:nth-child(3),
  #weeks .one td:nth-child(3){
    width:50px;
    min-width:50px;
    max-width:50px;
    white-space:normal;
    overflow-wrap:anywhere;
    word-break:break-word;
    line-height:1.3;
  }

  /* EDIT / SAVE */
  #weeks .one th:nth-child(4),
  #weeks .one td:nth-child(4){
    width:20px;
    min-width:20px;
    max-width:20px;
    padding:4px 1px;
  }

  /* DAY OFF */
  #weeks .one th:nth-child(5),
  #weeks .one td:nth-child(5){
    width:70px;
    min-width:70px;
    max-width:70px;
  }

  /* INPUTS */
  #weeks .one input{
    width:100%;
    min-width:0;
    box-sizing:border-box;
    white-space:nowrap;
    overflow-x:auto;
  }

  /* EDIT / SAVE BUTTON */
  #weeks .one .act{
    width:56px;
    min-width:56px;
    max-width:56px;
    padding:5px 1px;
    margin:0;
    font-size:.7rem;
    white-space:nowrap;
  }

  /* DAY OFF BUTTON */
  #weeks .one .offb{
    width:20px;
    min-width:20px;
    max-width:20px;
    padding:0;
    margin:0;
    font-size:.6rem;
    white-space:nowrap;
    text-align:center;
  }

}
</style>

</head>

<body>

<!-- LOGIN SCREEN -->
<div id="loginScreen">

  <div class="login-card">
<img src="right_calories_logo.jpg" alt="Right Calories logo">
    <h1>My 20-Day Meal Plan</h1>
    <p>Sign in to access your meal plan.</p>

    <input id="email" type="email" placeholder="Email address" autocomplete="email">

    <input id="password" type="password" placeholder="Password" autocomplete="current-password">

    <button id="loginBtn">Sign in</button>

    <div id="loginError" class="login-error"></div>

  </div>

</div>


<!-- MAIN APP -->
<div id="app">

<div class="wrap">

<header>

<img src="right_calories_logo.jpg" alt="Right Calories logo">
<h1>My 20-Day Meal Plan</h1>

<p class="sub">
5 Oct – 1 Nov · write your lunch &amp; snack for each day
</p>

<div class="account">

<button class="logout" id="logoutBtn">Log out</button>
</div>

<div id="status" class="status"></div>

</header>


<div class="prog">

<div class="bar">
<i id="fill"></i>
</div>

<div class="pt">
<span id="cnt">0 / 20 days planned</span>
<span id="pct">0%</span>
</div>

</div>


<div id="weeks"></div>


<footer>
<button id="reset">Clear all</button>
</footer>

</div>

</div>


<script>

/* =========================================================
   SUPABASE CONNECTION
   ========================================================= */
const SUPABASE_URL =
'https://xyaapnybxjzfcevekyqx.supabase.co';

const SUPABASE_KEY =
'sb_publishable_m43URQM4pjBFKKjajXxWEw_ME5R8E4U';


const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =========================================================
   MEAL PLAN SETTINGS
   ========================================================= */

const K = 'rc-plan-v1';

const D = [
  'Sat',
  'Sun',
  'Mon',
  'Tue',
  'Wed',
  'Thu',
  'Fri'
];

const M = [
  'Jan',
  'Feb',
  'Mar',
  'Apr',
  'May',
  'Jun',
  'Jul',
  'Aug',
  'Sep',
  'Oct',
  'Nov',
  'Dec'
];

const start = new Date(2026, 9, 5);
const end   = new Date(2026, 10, 1);

let S = {};
let currentUser = null;


/* =========================================================
   DATE HELPERS
   ========================================================= */

function key(d){

  const year = d.getFullYear();

  const month = String(d.getMonth() + 1).padStart(2,'0');

  const day = String(d.getDate()).padStart(2,'0');

  return `${year}-${month}-${day}`;
}


function defaultState(i){

  return {
    l:'',
    s:'',
    off:i === 0 || i === 6,
    saved:false
  };

}


/* =========================================================
   STATUS MESSAGE
   ========================================================= */

function status(message){

  document.getElementById('status').textContent = message || '';

}


/* =========================================================
   LOGIN
   ========================================================= */

document.getElementById('loginBtn').onclick = async function(){

  const email =
    document.getElementById('email').value.trim();

  const password =
    document.getElementById('password').value;

  const errorBox =
    document.getElementById('loginError');

  errorBox.textContent = '';

  if(!email || !password){

    errorBox.textContent =
      'Please enter your email and password.';

    return;
  }

  this.disabled = true;
  this.textContent = 'Signing in...';

  const { data, error } =
    await supabaseClient.auth.signInWithPassword({
      email,
      password
    });

  this.disabled = false;
  this.textContent = 'Sign in';

  if(error){

    errorBox.textContent = error.message;

    return;
  }

  currentUser = data.user;

  await startApp();

};


/* =========================================================
   LOG OUT
   ========================================================= */

document.getElementById('logoutBtn').onclick = async function(){

  await supabaseClient.auth.signOut();

  currentUser = null;

  document.getElementById('app').style.display = 'none';

  document.getElementById('loginScreen').style.display = 'flex';

};


/* =========================================================
   LOCAL STORAGE MIGRATION
   ========================================================= */

/*
   Your old version used localStorage.

   This function checks whether you have old meal data
   saved on your laptop and moves it into Supabase.
*/

function getOldLocalData(){

  try{

    const old =
      JSON.parse(
        localStorage.getItem(K) || '{}'
      );

    return old;

  }catch(e){

    return {};

  }

}


function normalizeOldData(old){

  const result = {};

  Object.keys(old).forEach(oldKey => {

    const parts = oldKey.split('-');

    if(parts.length !== 3) return;

    const year = parts[0];

    const month =
      String(parts[1]).padStart(2,'0');

    const day =
      String(parts[2]).padStart(2,'0');

    const newKey =
      `${year}-${month}-${day}`;

    result[newKey] = old[oldKey];

  });

  return result;

}


async function migrateOldLocalData(){

  const oldRaw = getOldLocalData();

  const oldData = normalizeOldData(oldRaw);

  const keys = Object.keys(oldData);

  if(keys.length === 0){

    return;

  }

  const rows = keys.map(k => {

    const item = oldData[k];

    return {
      user_id: currentUser.id,
      meal_date: k,
      lunch: item.l || '',
      snack: item.s || '',
      day_off: !!item.off,
      saved: !!item.saved
    };

  });

  const { error } =
    await supabaseClient
      .from('meal_plan')
      .upsert(
        rows,
        {
          onConflict:'user_id,meal_date'
        }
      );

  if(error){

    console.error(
      'Migration error:',
      error
    );

    return;

  }

  localStorage.removeItem(K);

}


/* =========================================================
   LOAD MEALS FROM SUPABASE
   ========================================================= */

async function loadMeals(){

  status('Loading your meal plan...');

  S = {};

  const { data, error } =
    await supabaseClient
      .from('meal_plan')
      .select('*')
      .eq('user_id', currentUser.id);

  if(error){

    console.error(error);

    status(
      'Could not load your meal plan.'
    );

    alert(
      'Could not load your meal plan. Please check your Supabase settings.'
    );

    return;

  }

  (data || []).forEach(row => {

    S[row.meal_date] = {

      l: row.lunch || '',

      s: row.snack || '',

      off: !!row.day_off,

      saved: !!row.saved

    };

  });

  status('');

}


/* =========================================================
   SAVE ONE DAY TO SUPABASE
   ========================================================= */

async function saveDay(k){

  const st = S[k];

  if(!st || !currentUser){

    return;

  }

  const { error } =
    await supabaseClient
      .from('meal_plan')
      .upsert(
        {
          user_id: currentUser.id,
          meal_date: k,
          lunch: st.l || '',
          snack: st.s || '',
          day_off: !!st.off,
          saved: !!st.saved,
          updated_at: new Date().toISOString()
        },
        {
          onConflict:'user_id,meal_date'
        }
      );

  if(error){

    console.error(
      'Save error:',
      error
    );

    status('Could not save this day.');

    return false;

  }

  return true;

}


/* =========================================================
   DELETE ONE DAY
   ========================================================= */

async function deleteDay(k){

  if(!currentUser){

    return false;

  }

  const { error } =
    await supabaseClient
      .from('meal_plan')
      .delete()
      .eq('user_id', currentUser.id)
      .eq('meal_date', k);

  if(error){

    console.error(
      'Delete error:',
      error
    );

    return false;

  }

  return true;

}


/* =========================================================
   BUILD TABLE
   ========================================================= */

const root =
  document.getElementById('weeks');


function build(){

  let r =
    '<table class="one">' +
    '<tr>' +
    '<th>Date</th>' +
    '<th>Lunch</th>' +
    '<th>Snack</th>' +
    '<th></th>' +
    '<th></th>' +
    '</tr>';


  for(
    let d = new Date(start), i = 2;
    d <= end;
    d.setDate(d.getDate()+1),
    i = (i+1)%7
  ){

    const k = key(d);

    if(!S[k]){

      S[k] = defaultState(i);

    }

    const st = S[k];


    r +=
      '<tr data-k="' + k + '" class="' +
      (st.off ? 'off' : '') +
      '">' +

      '<td>' +
      '<b>' + d.getDate() + '</b>' +
      '<small>' +
      D[i] +
      ' · ' +
      M[d.getMonth()] +
      '</small>' +
      '</td>' +

      (
        st.off

        ?

        '<td colspan="2">' +
        '<small>Day off</small>' +
        '</td>'

        :

        '<td>' +
        '<input type="text" ' +
        (st.saved ? 'disabled ' : '') +
        'data-k="' + k + '" ' +
        'data-f="l" ' +
        'placeholder="Chosen meal">' +
        '</td>' +

        '<td>' +
        '<input type="text" ' +
        (st.saved ? 'disabled ' : '') +
        'data-k="' + k + '" ' +
        'data-f="s" ' +
        'placeholder="Chosen snack">' +
        '</td>'
      ) +

      '<td>' +

      (
        st.off

        ?

        ''

        :

        '<button class="act ' +
        (st.saved ? 'ed' : 'sv') +
        '" data-k="' + k + '">' +
        (st.saved ? 'Edit' : 'Save') +
        '</button>'
      ) +

      '</td>' +

      '<td>' +

      '<button class="offb" data-k="' + k + '">' +
      (st.off ? 'Add to plan' : 'Day off') +
      '</button>' +

      '</td>' +

      '</tr>';

  }


  root.innerHTML =
    r +
    '</table>';


  /* INPUTS */

  root.querySelectorAll('input').forEach(inp => {

    const st =
      S[inp.dataset.k];

    inp.value =
      st[inp.dataset.f];


    inp.oninput = function(){

      st[inp.dataset.f] =
        inp.value;

      upd(inp.dataset.k);

    };

  });


  /* DAY OFF */

  root.querySelectorAll('.offb').forEach(b => {

    b.onclick = async function(){

      const k =
        b.dataset.k;

      const st =
        S[k];

      st.off =
        !st.off;

      /*
        If it is made a day off, save it immediately.
      */

      if(st.off){

        st.saved = false;

      }

      status('Saving...');

      const success =
        await saveDay(k);

      if(success){

        status('');

        build();

      }

    };

  });


  /* SAVE / EDIT */

  root.querySelectorAll('.act').forEach(b => {

    b.onclick = async function(){

      const k =
        b.dataset.k;

      const st =
        S[k];


      if(st.saved){

        /*
          EDIT mode
        */

        st.saved = false;

        build();

        return;

      }


      /*
        SAVE mode
      */

      if(!st.l.trim()){

        alert(
          'Please enter a lunch before saving.'
        );

        return;

      }

      status('Saving...');

      st.saved = true;

      const success =
        await saveDay(k);

      if(success){

        status('');

        build();

      }else{

        st.saved = false;

      }

    };

  });


  prog();

}


/* =========================================================
   UPDATE PROGRESS
   ========================================================= */

function upd(k){

  const st =
    S[k];

  const tr =
    document.querySelector(
      'tr[data-k="' + k + '"]'
    );

  if(tr){

    tr.classList.toggle(
      'done',
      !st.off &&
      !!st.saved &&
      !!st.l.trim()
    );

  }

  prog();

}


/* =========================================================
   PROGRESS BAR
   ========================================================= */

function prog(){

  let t = 0;
  let f = 0;


  for(
    let d = new Date(start);
    d <= end;
    d.setDate(d.getDate()+1)
  ){

    const s =
      S[key(d)];


    if(s && !s.off){

      t++;

      if(
        s.saved &&
        s.l.trim()
      ){

        f++;

      }

    }

  }


  const p =
    t
      ? Math.round((f/t)*100)
      : 0;


  document.getElementById('fill')
    .style.width = p + '%';

  document.getElementById('cnt')
    .textContent =
      f + ' / ' + t + ' days planned';

  document.getElementById('pct')
    .textContent =
      p + '%';

}


/* =========================================================
   CLEAR ALL
   ========================================================= */

document.getElementById('reset').onclick =
async function(){

  if(
    !confirm(
      'Clear all meals from your cloud meal plan?'
    )
  ){

    return;

  }


  status('Clearing...');


  const { error } =
    await supabaseClient
      .from('meal_plan')
      .delete()
      .eq('user_id', currentUser.id)
      .gte('meal_date','2026-10-05')
      .lte('meal_date','2026-11-01');


  if(error){

    console.error(error);

    status(
      'Could not clear the meal plan.'
    );

    return;

  }


  S = {};

  localStorage.removeItem(K);

  status('');

  build();

};


/* =========================================================
   START APPLICATION
   ========================================================= */
async function startApp(){

  document.getElementById('loginScreen').style.display = 'none';

  document.getElementById('app').style.display = 'block';

  await migrateOldLocalData();

  await loadMeals();

  build();

  requestAnimationFrame(() => {
    build();
  });

}


/* =========================================================
   CHECK EXISTING SESSION
   ========================================================= */

async function checkSession(){

  const { data } =
    await supabaseClient.auth.getSession();

  if(data && data.session){

    currentUser =
      data.session.user;

    await startApp();

  }

}


/* =========================================================
   START
   ========================================================= */

checkSession();

</script>
